name: Build Signed IPA & Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (CFBundleShortVersionString), e.g. 1.0 or 1.1.0. Leave blank to use tag or 1.0."
        required: false
        default: ""
        type: string
      build_number:
        description: "Build number (CFBundleVersion). Leave blank to auto-increment using github.run_number."
        required: false
        default: ""
        type: string
      run_tests:
        description: "Run iOS Simulator unit tests before archiving"
        required: false
        default: true
        type: boolean
      upload_to_testflight:
        description: "Validate and upload the signed IPA to TestFlight"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-testflight:
    name: Archive, Cloud-Sign IPA & Upload to TestFlight (Option A)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate Option A Secrets & Resolve Version Configuration
        id: config
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CONFIGURED_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || secrets.APP_BUNDLE_ID }}
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_RUN_TESTS: ${{ inputs.run_tests }}
          INPUT_UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          UPLOAD_TO_TESTFLIGHT="true"
          if [[ "${INPUT_UPLOAD_TO_TESTFLIGHT}" == "false" ]]; then
            UPLOAD_TO_TESTFLIGHT="false"
          fi

          RUN_TESTS="true"
          if [[ "${INPUT_RUN_TESTS}" == "false" ]]; then
            RUN_TESTS="false"
          fi

          # Option A: Cloud-Managed Automatic Signing via App Store Connect API Key
          # Requires only the 4 team-wide Apple secrets (no .p12 or .mobileprovision files needed).
          MISSING=()
          [[ -z "${APPLE_TEAM_ID}" ]] && MISSING+=("APPLE_TEAM_ID")
          [[ -z "${ASC_KEY_ID}" ]] && MISSING+=("ASC_KEY_ID")
          [[ -z "${ASC_ISSUER_ID}" ]] && MISSING+=("ASC_ISSUER_ID")
          [[ -z "${ASC_PRIVATE_KEY}" ]] && MISSING+=("ASC_PRIVATE_KEY")

          if (( ${#MISSING[@]} > 0 )); then
            {
              echo "### Missing Required GitHub Actions Secrets (Option A — Cloud-Managed Signing)"
              echo ""
              echo "Add the following repository secrets under **Settings → Secrets and variables → Actions**:"
              echo ""
              for item in "${MISSING[@]}"; do
                echo "- \`${item}\`"
              done
              echo ""
              echo "> Your App Store Connect API Key must have **Admin** or **App Manager** access so Xcode Cloud-Managed Signing can create/fetch the Apple Distribution certificate and App Store provisioning profile automatically."
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error::Missing required GitHub Actions secrets for Option A Cloud-Managed Signing: %s\n' "${MISSING[*]}"
            exit 1
          fi

          BUNDLE_ID="${CONFIGURED_BUNDLE_ID:-com.cozyproductivity.app}"

          # Resolve & normalize CFBundleShortVersionString (Apple requires 1-3 period-separated integers)
          RAW_VERSION_SOURCE=""
          if [[ -n "${INPUT_MARKETING_VERSION}" ]]; then
            RAW_VERSION_SOURCE="${INPUT_MARKETING_VERSION}"
            MARKETING_VERSION="${INPUT_MARKETING_VERSION#[vV]}"
          elif [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" =~ ^[vV] ]]; then
            RAW_VERSION_SOURCE="${REF_NAME}"
            RAW_WITHOUT_V="${REF_NAME#[vV]}"
            MARKETING_VERSION="${RAW_WITHOUT_V}"
            # Strip SemVer build metadata (+...) and prerelease suffix (-beta.1, -rc.2, etc.) from git tags
            MARKETING_VERSION="${MARKETING_VERSION%%+*}"
            MARKETING_VERSION="${MARKETING_VERSION%%-*}"
            if [[ "${RAW_WITHOUT_V}" != "${MARKETING_VERSION}" ]]; then
              echo "Normalized prerelease git tag '${REF_NAME}' -> MARKETING_VERSION='${MARKETING_VERSION}'"
            fi
          else
            MARKETING_VERSION="1.0"
          fi

          if [[ -n "${INPUT_BUILD_NUMBER}" ]]; then
            BUILD_NUMBER="${INPUT_BUILD_NUMBER}"
          else
            BUILD_NUMBER="${RUN_NUMBER}"
          fi

          APPLE_VERSION_REGEX='^[0-9]+(\.[0-9]+){0,2}$'
          if [[ ! "${MARKETING_VERSION}" =~ ${APPLE_VERSION_REGEX} ]]; then
            {
              echo "### Invalid Marketing Version (\`CFBundleShortVersionString\`)"
              echo ""
              echo "- **Input / Tag**: \`${RAW_VERSION_SOURCE:-${MARKETING_VERSION}}\`"
              echo "- **Resolved Value**: \`${MARKETING_VERSION}\`"
              echo "- **Required Format**: 1 to 3 period-separated non-negative integers (e.g. \`1.0\`, \`1.2.0\`, or tag \`v1.2.0-beta.1\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error::Invalid MARKETING_VERSION "%s" (from "%s"). Apple requires 1-3 period-separated integers (e.g. 1.0 or 1.2.0).\n' \
              "${MARKETING_VERSION}" "${RAW_VERSION_SOURCE:-${MARKETING_VERSION}}"
            exit 1
          fi

          if [[ ! "${BUILD_NUMBER}" =~ ${APPLE_VERSION_REGEX} ]]; then
            {
              echo "### Invalid Build Number (\`CFBundleVersion\`)"
              echo ""
              echo "- **Resolved Value**: \`${BUILD_NUMBER}\`"
              echo "- **Required Format**: 1 to 3 period-separated non-negative integers (e.g. \`42\` or \`1.0.42\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error::Invalid BUILD_NUMBER "%s". Apple requires 1-3 period-separated integers.\n' "${BUILD_NUMBER}"
            exit 1
          fi

          echo "bundle_id=${BUNDLE_ID}" >> "$GITHUB_OUTPUT"
          echo "marketing_version=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "run_tests=${RUN_TESTS}" >> "$GITHUB_OUTPUT"
          echo "upload_to_testflight=${UPLOAD_TO_TESTFLIGHT}" >> "$GITHUB_OUTPUT"

          echo "Resolved Option A configuration:"
          echo "  Bundle ID:            ${BUNDLE_ID}"
          echo "  Marketing Version:    ${MARKETING_VERSION}"
          echo "  Build Number:         ${BUILD_NUMBER}"
          echo "  Signing Mode:         automatic (Cloud-Managed via App Store Connect API Key)"
          echo "  Run Unit Tests:       ${RUN_TESTS}"
          echo "  Upload to TestFlight: ${UPLOAD_TO_TESTFLIGHT}"

      - name: Run Unit Tests on iOS Simulator
        if: steps.config.outputs.run_tests == 'true'
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for dev in devices:
                  if dev.get("isAvailable") and "iPhone" in dev.get("name", ""):
                      candidates.append((runtime, dev["name"], dev["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulator found")
          candidates.sort()
          print(candidates[-1][2])
          PY
          )
          echo "Running unit tests on Simulator UDID: $UDID"
          xcodebuild test \
            -project CozyProductivity.xcodeproj \
            -scheme CozyProductivity \
            -destination "platform=iOS Simulator,id=${UDID}" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Install App Store Connect API Key (.p8)
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          ASC_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$ASC_KEYS_DIR"
          chmod 700 "$ASC_KEYS_DIR"
          ASC_KEY_PATH="${ASC_KEYS_DIR}/AuthKey_${ASC_KEY_ID}.p8"

          ASC_KEY_PATH="$ASC_KEY_PATH" python3 - <<'PY'
          import base64, os, pathlib, sys

          raw = os.environ["ASC_PRIVATE_KEY"].strip()
          out_path = pathlib.Path(os.environ["ASC_KEY_PATH"])
          if "BEGIN PRIVATE KEY" in raw:
              content = raw
          else:
              try:
                  cleaned = "".join(raw.split())
                  content = base64.b64decode(cleaned).decode("utf-8")
              except Exception as exc:
                  print(f"::error::ASC_PRIVATE_KEY is neither a PEM private key nor valid base64-encoded PEM: {exc}", file=sys.stderr)
                  sys.exit(1)

          if "BEGIN PRIVATE KEY" not in content or "END PRIVATE KEY" not in content:
              print("::error::Decoded ASC_PRIVATE_KEY does not contain a valid PKCS#8 PEM block ('BEGIN PRIVATE KEY').", file=sys.stderr)
              sys.exit(1)

          if not content.endswith("\n"):
              content += "\n"

          out_path.write_text(content, encoding="utf-8")
          out_path.chmod(0o600)
          PY

          echo "asc_key_path=${ASC_KEY_PATH}" >> "$GITHUB_OUTPUT"
          echo "Installed App Store Connect API key at ${ASC_KEY_PATH}"

      - name: Archive Release Build (Cloud-Managed Automatic Signing)
        id: archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          MARKETING_VERSION: ${{ steps.config.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.config.outputs.build_number }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="${RUNNER_TEMP}/CozyProductivity.xcarchive"

          # Compile & archive without requiring a local Apple Development certificate on the ephemeral runner;
          # Cloud-Managed Apple Distribution signing & App Store profile provisioning execute during -exportArchive.
          xcodebuild clean archive \
            -project CozyProductivity.xcodeproj \
            -scheme CozyProductivity \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          # Record Team ID in the xcarchive ApplicationProperties so xcodebuild -exportArchive resolves automatic cloud signing
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:Team ${APPLE_TEAM_ID}" "${ARCHIVE_PATH}/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Team string ${APPLE_TEAM_ID}" "${ARCHIVE_PATH}/Info.plist"

          RECORDED_TEAM=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:Team" "${ARCHIVE_PATH}/Info.plist")
          if [[ "${RECORDED_TEAM}" != "${APPLE_TEAM_ID}" ]]; then
            echo "::error::Failed to stamp Team ID into xcarchive Info.plist"
            exit 1
          fi

          echo "archive_path=${ARCHIVE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Export Cloud-Signed IPA via App Store Connect API Key
        id: export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ steps.signing.outputs.asc_key_path }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
        run: |
          set -euo pipefail
          EXPORT_PATH="${RUNNER_TEMP}/export"
          EXPORT_OPTIONS_PLIST="${RUNNER_TEMP}/ExportOptions.plist"
          mkdir -p "${EXPORT_PATH}"

          EXPORT_OPTIONS_PLIST="${EXPORT_OPTIONS_PLIST}" python3 - <<'PY'
          import os, plistlib

          payload = {
              "method": "app-store-connect",
              "destination": "export",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "automatic",
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": False,
          }

          with open(os.environ["EXPORT_OPTIONS_PLIST"], "wb") as fh:
              plistlib.dump(payload, fh)
          PY

          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PLIST}" \
            -exportPath "${EXPORT_PATH}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

          IPA_PATH=$(find "${EXPORT_PATH}" -maxdepth 1 -name "*.ipa" | head -n 1)
          if [[ -z "${IPA_PATH}" || ! -f "${IPA_PATH}" ]]; then
            echo "::error::xcodebuild -exportArchive finished without producing an .ipa file in ${EXPORT_PATH}"
            ls -la "${EXPORT_PATH}"
            exit 1
          fi

          # Verify the exported IPA embeds an App Store provisioning profile
          if ! unzip -l "${IPA_PATH}" | grep -q "embedded.mobileprovision"; then
            echo "::error::Exported IPA at ${IPA_PATH} is missing embedded.mobileprovision"
            exit 1
          fi

          # Package dSYMs alongside the IPA artifact for crash symbolication archival
          DSYMS_DIR="${ARCHIVE_PATH}/dSYMs"
          if [[ -d "${DSYMS_DIR}" ]]; then
            ditto -c -k --sequesterRsrc --keepParent "${DSYMS_DIR}" "${EXPORT_PATH}/CozyProductivity-dSYMs.zip"
          fi

          IPA_SIZE=$(du -h "${IPA_PATH}" | awk '{print $1}')
          echo "ipa_path=${IPA_PATH}" >> "$GITHUB_OUTPUT"
          echo "export_path=${EXPORT_PATH}" >> "$GITHUB_OUTPUT"
          echo "ipa_size=${IPA_SIZE}" >> "$GITHUB_OUTPUT"
          echo "Exported cloud-signed IPA: ${IPA_PATH} (${IPA_SIZE})"

      - name: Upload Signed IPA & dSYMs as Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Cozy-iOS-${{ steps.config.outputs.marketing_version }}-build-${{ steps.config.outputs.build_number }}
          path: |
            ${{ steps.export.outputs.export_path }}/*.ipa
            ${{ steps.export.outputs.export_path }}/*.zip
            ${{ steps.export.outputs.export_path }}/DistributionSummary.plist
          retention-days: 14
          if-no-files-found: error

      - name: Validate & Upload Signed IPA to TestFlight
        if: steps.config.outputs.upload_to_testflight == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IPA_PATH: ${{ steps.export.outputs.ipa_path }}
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"

          echo "Validating IPA against App Store Connect..."
          xcrun altool --validate-app \
            --file "${IPA_PATH}" \
            --type ios \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"

          echo "Uploading signed IPA to TestFlight..."
          xcrun altool --upload-app \
            --file "${IPA_PATH}" \
            --type ios \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"

      - name: Write Deployment Summary
        if: success()
        env:
          BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          MARKETING_VERSION: ${{ steps.config.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.config.outputs.build_number }}
          UPLOADED: ${{ steps.config.outputs.upload_to_testflight }}
          IPA_SIZE: ${{ steps.export.outputs.ipa_size }}
        run: |
          {
            echo "### Cozy TestFlight Build Summary (Option A — Cloud-Managed Signing)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **App Name** | Cozy |"
            echo "| **Bundle Identifier** | \`${BUNDLE_ID}\` |"
            echo "| **Marketing Version** | \`${MARKETING_VERSION}\` |"
            echo "| **Build Number** | \`${BUILD_NUMBER}\` |"
            echo "| **Signing Mode** | \`automatic (Cloud-Managed via ASC API Key)\` |"
            echo "| **Signed IPA Size** | \`${IPA_SIZE}\` |"
            echo "| **Uploaded to TestFlight** | \`${UPLOADED}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean Up Temporary App Store Connect API Key
        if: always()
        env:
          ASC_KEY_PATH: ${{ steps.signing.outputs.asc_key_path }}
        run: |
          if [[ -n "${ASC_KEY_PATH}" ]]; then
            rm -f "${ASC_KEY_PATH}"
          fi
          rm -f "${RUNNER_TEMP}/ExportOptions.plist"
