name: iOS Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Run Unit Tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode 26+ & Show Version
        run: |
          set -euo pipefail
          LATEST_XCODE_26=$(ls -d /Applications/Xcode_26*.app/Contents/Developer 2>/dev/null | grep -v -i beta | sort -V | tail -n 1 || true)
          if [[ -n "${LATEST_XCODE_26}" && -d "${LATEST_XCODE_26}" ]]; then
            DEV_DIR="${LATEST_XCODE_26}"
          else
            DEV_DIR="/Applications/Xcode.app/Contents/Developer"
          fi
          export DEVELOPER_DIR="${DEV_DIR}"
          echo "DEVELOPER_DIR=${DEV_DIR}" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Resolve available iPhone Simulator UDID
        id: simulator
        run: |
          UDID=$(python3 - <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for dev in devices:
                  if dev.get("isAvailable") and "iPhone" in dev.get("name", ""):
                      candidates.append((runtime, dev["name"], dev["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulator found")
          candidates.sort()
          print(candidates[-1][2])
          PY
          )
          echo "Selected Simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build & Test CozyProductivity
        run: |
          xcodebuild test \
            -project CozyProductivity.xcodeproj \
            -scheme CozyProductivity \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify Release Archive & Option A Packaging Metadata (generic/platform=iOS)
        run: |
          set -euo pipefail

          # Verify TestFlight prerelease tag normalizer & Apple CFBundleShortVersionString validator
          normalize_tag() {
            local raw="$1"
            local v="${raw#[vV]}"
            v="${v%%+*}"
            v="${v%%-*}"
            printf '%s' "$v"
          }
          REGEX='^[0-9]+(\.[0-9]+){0,2}$'
          [[ "$(normalize_tag 'v1.0.0-beta.1')" == "1.0.0" ]]
          [[ "$(normalize_tag 'v2.4.0-rc.3+build.9')" == "2.4.0" ]]
          [[ "1.0.0" =~ ${REGEX} ]]
          [[ ! "1.0.0.4" =~ ${REGEX} ]]
          [[ ! "beta" =~ ${REGEX} ]]

          ARCHIVE_PATH="${RUNNER_TEMP}/CozyProductivity-CI.xcarchive"
          xcodebuild archive \
            -project CozyProductivity.xcodeproj \
            -scheme CozyProductivity \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="42" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:Team ABCDE12345" "${ARCHIVE_PATH}/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Team string ABCDE12345" "${ARCHIVE_PATH}/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:Team' "${ARCHIVE_PATH}/Info.plist")" = "ABCDE12345"
          test -d "${ARCHIVE_PATH}/Products/Applications/CozyProductivity.app"
          test -f "${ARCHIVE_PATH}/Products/Applications/CozyProductivity.app/PrivacyInfo.xcprivacy"
          rm -rf "${ARCHIVE_PATH}"
